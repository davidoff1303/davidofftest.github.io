<!DOCTYPE html>
<html>
<body>
	<p id="demo">Click the button to change the text in this paragraph.</p>
	<button onclick="myFunction()">Try it</button> 
	<script>
	function myFunction() { 	
        let str=document.getElementById("demo").textContent;
        alert(str);
	}
	</script>
</body>
</html>
